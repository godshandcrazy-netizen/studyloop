<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyLoop Arena</title>
<link rel="stylesheet" href="style.css?v=11">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#102126">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyLoop">
<link rel="apple-touch-icon" href="icon-192.png">


<style>
.node.review-green{background:#58cc42!important;box-shadow:0 8px 0 #3da52f!important;color:white!important}
.node.review-yellow{background:#f3c94b!important;box-shadow:0 8px 0 #b38e16!important;color:#222!important}
.node.review-black{background:#111!important;box-shadow:0 8px 0 #000!important;color:white!important}
.node.review-due::after{content:"복습";position:absolute;top:-14px;right:-18px;background:#ff735a;color:#fff;font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px}
.daily-card{margin:0 18px 16px;padding:16px;background:#fff;color:#203037;border-radius:16px}
.daily-card h3{margin:0 0 7px}.daily-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.daily-item{background:#eef6f8;border-radius:12px;padding:10px;text-align:center}.daily-item b{display:block;font-size:21px}
.mock-card{background:#fff;border:1px solid #dfe7ea;border-radius:14px;padding:14px;margin-top:10px}
.mock-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mock-levels button{padding:12px;border-radius:12px;background:#22afe8;color:#fff;font-weight:900}
.mock-question{background:#fff;border:1px solid #dfe7ea;border-radius:14px;padding:16px;margin:12px 0}
.mock-choice{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:2px solid #dbe4e7;border-radius:12px;background:#fff;font-weight:800}
.mock-choice.selected{border-color:#22afe8;background:#eef9fd}
</style>

</head>
<body>
<section id="setup" class="setup">
  <div class="card">
    <div class="logo">StudyLoop Arena</div>
    <h1 id="authTitle">로그인</h1>

    <div id="loginFields">
      <label>아이디
        <input id="loginId" maxlength="20" autocomplete="username" placeholder="아이디">
      </label>
      <label>비밀번호
        <input id="loginPw" type="password" minlength="6" autocomplete="current-password" placeholder="비밀번호">
      </label>
      <button id="loginBtn">로그인</button>
      <button id="showSignupBtn" style="margin-top:10px;background:#22afe8;box-shadow:0 4px 0 #087aa8;">회원가입</button>
    </div>

    <div id="signupFields" class="hidden">
      <label>아이디
        <input id="signupId" maxlength="20" autocomplete="username" placeholder="영문/숫자 아이디">
      </label>
      <label>비밀번호
        <input id="signupPw" type="password" minlength="6" autocomplete="new-password" placeholder="6자 이상">
      </label>
      <label>이름
        <input id="signupName" maxlength="20" placeholder="이름">
      </label>
      <label>목표 점수
        <input id="signupGoal" type="number" min="0" max="100" value="90">
      </label>
      <button id="signupBtn">계정 만들기</button>
      <button id="showLoginBtn" style="margin-top:10px;background:#22afe8;box-shadow:0 4px 0 #087aa8;">로그인으로 돌아가기</button>
    </div>

    <p id="setupMsg" class="msg"></p>
  </div>
</section>

<main id="app" class="app hidden">
 <header><b>📚 역사</b><span>🔥 <b>1</b></span><span>⌛ <b id="xp">0</b></span><span>🎯 <b id="goalTop">90</b></span></header>
 <div id="roomBanner" class="hidden" style="margin:0 18px 14px;padding:10px 14px;border-radius:14px;background:#173b47;border:2px solid #3e91b0;font-weight:900;text-align:center;">
   🏆 <span id="roomBannerName"></span> · 코드 <span id="roomBannerCode"></span>
 </div>
 <section id="home" class="page active">
  <div id="dailyStudyCard" class="daily-card">
  <h3>📅 오늘 할 분량</h3>
  <div id="dailyStudyText" class="msg">계산 중...</div>
  <div class="daily-grid">
    <div class="daily-item"><b id="dailyNew">0</b><small>새 레슨</small></div>
    <div class="daily-item"><b id="dailyReview">0</b><small>복습</small></div>
    <div class="daily-item"><b id="dailyMock">0</b><small>모의시험</small></div>
  </div>
</div>
<div class="unit"><small id="hello"></small><h2>몽골 제국의 성립과<br>동서 문화 교류</h2></div>
  <div id="path" class="path"></div>
 </section>
 <section id="plan" class="page">
  <div class="panel">
    <h2>🧠 목표 맞춤 커리큘럼</h2>
    <div id="curriculum"></div>

    <hr style="margin:24px 0;border:0;border-top:1px solid #dfe7ea">

    <h2>📚 내 커리큘럼</h2>
    <p class="msg">커리큘럼마다 목표 점수와 시험 날짜를 따로 설정할 수 있어.</p>

    <label>커리큘럼 이름
      <input id="curriculumTitle" maxlength="40" placeholder="예: 2학기 중간고사 역사">
    </label>

    <label>목표 점수
      <input id="curriculumTargetScore" type="number" min="0" max="100" value="90">
    </label>

    <label>시험 날짜
      <input id="curriculumExamDate" type="date">
    </label>

    <label>학습 자료 (여러 장 선택 가능)
      <input id="curriculumFile" type="file" accept="application/pdf,image/*,.heic,.heif" multiple>
    </label>

    <button id="uploadCurriculum" class="primary" style="width:100%;margin-top:10px;">
      커리큘럼 만들기
    </button>
    <p id="curriculumMsg" class="msg"></p>
    <div id="myCurricula"></div>

    <hr style="margin:26px 0;border:0;border-top:1px solid #dfe7ea">

    <h2>📝 모의시험</h2>
    <p class="msg">난이도를 골라 바로 모의시험을 볼 수 있어.</p>
    <div class="mock-card">
      <div class="mock-levels">
        <button id="mockEasy">쉬움</button>
        <button id="mockNormal">보통</button>
        <button id="mockHard">어려움</button>
      </div>
      <p id="mockInfo" class="msg"></p>
    </div>
    <div id="mockExamArea"></div>
  </div>
</section>
 <section id="rank" class="page">
  <div class="panel">
    <h2>🏆 친구방</h2>

    <div id="currentRoomBox" class="curr hidden">
      <b id="currentRoomName">현재 방</b><br>
      <small>방 코드: <span id="currentRoomCode"></span></small>
    </div>

    <div class="roomActions">
      <input id="roomName" placeholder="방 이름">
      <button id="createRoom">방 만들기</button>
    </div>

    <div class="roomActions">
      <input id="roomCode" placeholder="방 코드">
      <button id="joinRoom">참가</button>
    </div>

    <p id="roomInfo" class="msg"></p>

    <h3 style="margin-top:22px">주간 랭킹</h3>
    <div id="ranking"></div>

    <h3 style="margin-top:24px">💬 방 채팅</h3>
    <div id="chatList" style="max-height:320px;overflow:auto;background:#fff;border:1px solid #dfe7ea;border-radius:13px;padding:10px;"></div>
    <div class="roomActions" style="margin-top:10px">
      <input id="chatInput" maxlength="300" placeholder="메시지 입력">
      <button id="sendChat">보내기</button>
    </div>
    <p id="chatMsg" class="msg"></p>

    <h3 style="margin-top:24px">📚 방 커리큘럼</h3>
    <div id="roomCurricula"></div>
  </div>
</section>
 <section id="profile" class="page">
  <div class="panel">
    <h2>👤 <span id="profileName"></span></h2>
    <p id="profileGoal"></p>
    <h3 id="profileXp"></h3>

    <div style="margin-top:18px">
      <label style="display:block;font-weight:850;margin-bottom:7px;">이름 변경</label>
      <div class="roomActions">
        <input id="newNameInput" maxlength="20" placeholder="새 이름">
        <button id="changeNameBtn">변경</button>
      </div>
      <p id="nameMsg" class="msg"></p>
    </div>

    <button id="resetProgressBtn" style="width:100%;margin-top:18px;background:#ff5b5b;color:white;font-weight:900;border-radius:13px;padding:14px;box-shadow:0 4px 0 #c93d3d;">
      진도·XP 초기화
    </button>
    <p id="resetMsg" class="msg"></p>

    <button id="logoutBtn" style="width:100%;margin-top:10px;background:#445b63;color:white;font-weight:900;border-radius:13px;padding:14px;box-shadow:0 4px 0 #2d3f45;">
      로그아웃
    </button>
  </div>
</section>
 <nav><button data-page="home" class="active">🏠</button><button data-page="plan">🧠</button><button data-page="rank">🏆</button><button data-page="profile">👤</button></nav>
</main>

<div id="lesson" class="lesson hidden">
 <div class="lessonHead"><button id="close">×</button><div class="bar"><i id="bar"></i></div><span>❤️ 5</span></div>
 <div class="lessonBody"><small>개념 → 확인 문제</small><h2 id="ltitle"></h2><div id="concept" class="concept"></div><h3 id="question"></h3><div id="answers"></div><p id="feedback"></p><button id="next" class="hidden">다음</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=11"></script>

<button id="installAppBtn"
  style="display:none;position:fixed;right:16px;bottom:92px;z-index:99;border:0;border-radius:999px;padding:13px 16px;background:#58cc42;color:white;font-weight:900;box-shadow:0 5px 0 #3da52f;">
  📲 앱 설치
</button>

<script>
let deferredInstallPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById("installAppBtn");
  if (btn) btn.style.display = "block";
});

document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("installAppBtn");

  if (btn) {
    btn.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.style.display = "none";
    });
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  }
});

window.addEventListener("appinstalled", () => {
  const btn = document.getElementById("installAppBtn");
  if (btn) btn.style.display = "none";
});
</script>

</body></html>
